name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout & build
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & build
        run: |
          npm ci
          npm run build
          tar czf remix-build.tar.gz \
            build public package.json package-lock.json ecosystem.config.cjs

      # 2) SSH auth setup
      - name: Add Droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} \
            >> ~/.ssh/known_hosts
      
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure deploy script exists
        run: |
          if [[ ! -f scripts/deploy.sh ]]; then
            echo "❌ Error: scripts/deploy.sh not found in repo root (expected at $GITHUB_WORKSPACE/scripts/deploy.sh)"
            exit 1
          fi
          
      # 3) Copy artifacts
      - name: Prepare remote dirs & copy files
        run: |
          # 1) Make sure /home/deployer/Development/projects/nf010-nifl-website-ui/scripts exists
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts"
      
          # 2) Copy the build tarball into the app root
          scp -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/remix-build.tar.gz"

          # 3) Copy your deploy script into that scripts/ folder
          scp -P "${{ secrets.SERVER_PORT }}" \
            scripts/deploy.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts/deploy.sh"
      - name: Copy artifacts & debug
        run: |
          REMOTE_DIR="/home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}"
          echo "Remote dir is: $REMOTE_DIR"
          
          # ensure scripts folder exists
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p $REMOTE_DIR/scripts"

          echo "--- SCP remix-build.tar.gz → $REMOTE_DIR/remix-build.tar.gz ---"
          scp -vvv -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_DIR/remix-build.tar.gz"

          echo "--- SCP deploy.sh → $REMOTE_DIR/scripts/deploy.sh ---"
          scp -vvv -P "${{ secrets.SERVER_PORT }}" \
            scripts/deploy.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_DIR/scripts/deploy.sh"

          echo "--- Remote root listing ($REMOTE_DIR) ---"
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -l $REMOTE_DIR"

          echo "--- Remote scripts listing ($REMOTE_DIR/scripts) ---"
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -l $REMOTE_DIR/scripts"
      - name: Run deploy script
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "export REMOTE_PATH='${{ secrets.REMOTE_PATH }}' && \
             bash /home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts/deploy.sh"
