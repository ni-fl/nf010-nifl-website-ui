name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout & build
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & build
        run: |
          npm ci
          npm run build
          tar czf remix-build.tar.gz \
            build public package.json package-lock.json ecosystem.config.cjs

      # 2) SSH auth setup
      - name: Add Droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} \
            >> ~/.ssh/known_hosts

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3) Copy the build to the server
      - name: Copy build to server
        run: |
          scp -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/remix-build.tar.gz"

      # 4) SSH in and deploy inline
      - name: SSH & deploy
        run: |
          ssh -tt -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            set -e

            # Your target directory under home:
            TARGET="\$HOME/${{ secrets.REMOTE_PATH }}"

            # Clean old release (contents only), recreate
            rm -rf "\$TARGET"/*
            mkdir -p "\$TARGET"

            # Unpack the new build
            tar xzf ~/remix-build.tar.gz -C "\$TARGET"
            rm ~/remix-build.tar.gz

            cd "\$TARGET"

            # Install production dependencies
            npm ci --omit=dev

            # Reload (or start) via PM2
            pm2 reload ecosystem.config.cjs --env production --only nf010-nifl-website-ui \
              || pm2 start ecosystem.config.cjs --env production --only nf010-nifl-website-ui

            # Persist the PM2 process list
            pm2 save
          EOF
