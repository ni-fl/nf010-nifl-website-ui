name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build
          
      - name: Archive build
        run: |
          tar czf remix-build.tar.gz \
            build public package.json package-lock.json ecosystem.config.cjs

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} \
            >> ~/.ssh/known_hosts

      - name: Prepare remote dirs
        run: |
          ssh -i ~/.ssh/id_rsa -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p /home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts"

      - name: Copy build & deploy script
        run: |
          scp -i ~/.ssh/id_rsa -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            scripts/deploy.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts/"

      - name: Run deploy script
        run: |
          ssh -i ~/.ssh/id_rsa -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "export REMOTE_PATH='${{ secrets.REMOTE_PATH }}' && \
             bash /home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts/deploy.sh"

