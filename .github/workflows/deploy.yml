name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout & build
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & build
        run: |
          npm ci
          npm run build
          tar czf remix-build.tar.gz \
            build public package.json package-lock.json ecosystem.config.cjs

      # 2) SSH auth setup
      - name: Add Droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3) Sanity check deploy script
      - name: Ensure deploy script exists
        run: |
          if [[ ! -f scripts/deploy.sh ]]; then
            echo "❌ Error: scripts/deploy.sh not found in repo root"
            exit 1
          fi

      # 4) Create remote dirs and copy artifacts
      - name: Copy artifacts to server
        run: |
          REMOTE_DIR="/home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}"
          echo "→ Creating remote directories at $REMOTE_DIR/scripts"
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p \"$REMOTE_DIR/scripts\""

          echo "→ Copying build archive"
          scp -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_DIR/remix-build.tar.gz"

          echo "→ Copying deploy script"
          scp -P "${{ secrets.SERVER_PORT }}" \
            scripts/deploy.sh \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$REMOTE_DIR/scripts/deploy.sh"

      # 5) Run the deploy script
      - name: Run deploy script
        run: |
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "export REMOTE_PATH='${{ secrets.REMOTE_PATH }}' && \
             bash /home/${{ secrets.SERVER_USER }}/${{ secrets.REMOTE_PATH }}/scripts/deploy.sh"
