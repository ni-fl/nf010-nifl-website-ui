name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout & build
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & build
        run: |
          npm ci
          npm run build
          tar czf remix-build.tar.gz build public package.json package-lock.json ecosystem.config.cjs

      # 2) SSH setup
      - name: Add Droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} \
            >> ~/.ssh/known_hosts

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3) Deploy
      - name: Copy and deploy
        run: |
          # Copy the build archive to home
          scp -P "${{ secrets.SERVER_PORT }}" \
            remix-build.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/remix-build.tar.gz"

          # SSH in and run the whole deploy in one go
          ssh -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "set -e; \
             REMOTE=\$HOME/${{ secrets.REMOTE_PATH }}; \
             rm -rf \"\$REMOTE\"/*; \
             mkdir -p \"\$REMOTE\"; \
             tar xzf ~/remix-build.tar.gz -C \"\$REMOTE\"; \
             rm ~/remix-build.tar.gz; \
             cd \"\$REMOTE\"; \
             npm ci --omit=dev; \
             pm2 reload ecosystem.config.cjs --env production --only nf010-nifl-website-ui || \
               pm2 start ecosystem.config.cjs --env production --only nf010-nifl-website-ui; \
             pm2 save"
