name: CI / CD – Remix → DigitalOcean

on:
  push:
    branches: [ production ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Remix
        run: npm run build

      - name: Archive build
        run: |
          tar czf remix-build.tar.gz \
            build public package.json package-lock.json ecosystem.config.cjs

      - name: Add Droplet to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} \
            >> ~/.ssh/known_hosts
      
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy build to server
        run: |
          scp -P ${{ secrets.SERVER_PORT }} \
            remix-build.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~

      - name: SSH & deploy
        run: |
          ssh -tt -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            set -e

            REMOTE="$HOME/${{ secrets.REMOTE_PATH }}"

            # Clean out any old release
            rm -rf "$REMOTE"
            mkdir -p "$REMOTE"

            # Unpack the new build
            tar xzf ~/remix-build.tar.gz -C "$REMOTE"
            rm ~/remix-build.tar.gz

            cd "$REMOTE"

            # Fresh install of production deps
            npm ci --omit=dev

            # Reload if already running, otherwise start fresh
            pm2 reload ecosystem.config.cjs --env production --only nf010-nifl-website-ui \
              || pm2 start ecosystem.config.cjs --env production --only nf010-nifl-website-ui

            # Persist across reboots
            pm2 save
            EOF
          
